name: Build VoiceSkip Fold7 GigaAM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-fold7.yml'
      - 'build_court.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voiceskip-court-signing-v1
      - name: Prepare reviewed source and checksum-pinned models
        run: python3 build_court.py
      - name: Unit tests and ARM64 APK
        working-directory: court
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify packaged models and native libraries
        run: |
          mkdir -p deliverable
          cp court/app/build/outputs/apk/release/app-release.apk deliverable/VoiceSkip-Fold7-GigaAM.apk
          python3 - <<'PY'
          import json, zipfile, hashlib, struct
          from pathlib import Path
          p=Path('deliverable/VoiceSkip-Fold7-GigaAM.apk')
          with zipfile.ZipFile(p) as z:
              manifest=json.loads(z.read('assets/models/manifest.json'))
              assert len(manifest)==6
              for row in manifest:
                  data=z.read('assets/models/'+row['name'])
                  assert len(data)==row['size']
                  assert hashlib.sha256(data).hexdigest()==row['sha256']
              libs=[n for n in z.namelist() if n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
              assert not any('whisper' in n.lower() or 'vulkan' in n.lower() for n in z.namelist())
              for name in libs:
                  data=z.read(name); assert data[4]==2
                  phoff=struct.unpack_from('<Q',data,32)[0]
                  entsize,num=struct.unpack_from('<HH',data,54)
                  for i in range(num):
                      fields=struct.unpack_from('<IIQQQQQQ',data,phoff+i*entsize)
                      if fields[0]==1: assert fields[-1]>=16384,(name,fields[-1])
          Path('deliverable/SHA256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose deliverable/VoiceSkip-Fold7-GigaAM.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 deliverable/VoiceSkip-Fold7-GigaAM.apk > deliverable/alignment.txt
      - name: Build Android runtime tests
        working-directory: court
        run: gradle --no-daemon -PemulatorTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test native ASR, real diarization, decode, persistence and UI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          disable-animations: true
          script: |
            adb install court/app/build/outputs/apk/debug/app-debug.apk
            adb install court/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.voiceskip.fold7.court.test/androidx.test.runner.AndroidJUnitRunner > deliverable/android-tests.txt
            cat deliverable/android-tests.txt
            grep -q 'OK (1 test)' deliverable/android-tests.txt
            adb shell am start -n com.voiceskip.fold7.court/.MainActivity
            adb shell pm grant com.voiceskip.fold7.court android.permission.POST_NOTIFICATIONS
            adb shell screencap -p /sdcard/court.png
            adb pull /sdcard/court.png deliverable/android-screen.png
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSkip-Fold7-GigaAM-APK
          path: deliverable/
          compression-level: 0
          retention-days: 90
      - name: Upload source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-and-tests
          path: |
            court/app/src/main/java/
            court/app/build/reports/
            court/provenance.json
            deliverable/android-tests.txt
