name: Build VoiceSkip Fold7

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fold7.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Clone VoiceSkip
        run: |
          git clone --depth 1 https://github.com/tguillem/VoiceSkip.git source
          cd source
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1"

      - name: Patch VoiceSkip for Galaxy Z Fold7
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("source")

          # 1. Allow Adreno 830 while preserving blocklist for older/problematic Adreno.
          jni = root / "lib/src/main/jni/jni.c"
          text = jni.read_text()

          old = '''static bool
          is_gpu_blocklisted(const char *desc)
          {
              /* Adreno 6xx-7xx series (tested until 730) cause VK_ERROR_DEVICE_LOST or
               * fail to link some shaders. Mesa/Turnip prefixes its own name onto the
               * same silicon, so match anywhere rather than on the prefix.
               *
               * Xclipse and PowerVR failures can wedge both ggml and HWUI in the shared
               * GPU driver, resulting in an application ANR. */
              return strstr(desc, "Adreno") != NULL ||
                     strstr(desc, "Xclipse") != NULL ||
                     strstr(desc, "PowerVR") != NULL;
          }
          '''

          new = '''static bool
          is_gpu_blocklisted(const char *desc)
          {
              /* Fold7 patch:
               * allow Snapdragon 8 Elite / Adreno 830.
               * Keep the upstream block for other Adreno generations,
               * Xclipse and PowerVR.
               */
              const bool is_adreno_830 =
                  strstr(desc, "Adreno (TM) 830") != NULL ||
                  strstr(desc, "Adreno 830") != NULL;

              if (strstr(desc, "Adreno") != NULL && !is_adreno_830)
                  return true;

              return strstr(desc, "Xclipse") != NULL ||
                     strstr(desc, "PowerVR") != NULL;
          }
          '''

          if old not in text:
              raise SystemExit("GPU blocklist code not found; upstream changed")

          jni.write_text(text.replace(old, new))

          # 2. Russian language by default.
          pref = root / "app/src/main/java/com/voiceskip/data/UserPreferences.kt"
          text = pref.read_text()
          text = text.replace(
              'preferences[DEFAULT_LANGUAGE_KEY] ?: LANGUAGE_AUTO',
              'preferences[DEFAULT_LANGUAGE_KEY] ?: LANGUAGE_RUSSIAN'
          )
          pref.write_text(text)

          # 3. Give this build a separate package so it can coexist with Play/RuStore VoiceSkip.
          gradle = root / "app/build.gradle"
          text = gradle.read_text()
          text = text.replace(
              'applicationId "com.voiceskip"',
              'applicationId "com.voiceskip.fold7"'
          )
          text = text.replace(
              'versionName "1.0.7"',
              'versionName "1.0.7-fold7"'
          )
          gradle.write_text(text)

          # 4. Rename app visibly.
          strings = root / "app/src/main/res/values/strings.xml"
          text = strings.read_text()
          text = text.replace(
              '<string name="app_name">VoiceSkip</string>',
              '<string name="app_name">VoiceSkip Fold7</string>'
          )
          strings.write_text(text)

      - name: Replace bundled Whisper models with Large-v3-turbo q5_0
        run: |
          cd source/models_pack/src/main/assets/models

          # Keep Silero VAD only; remove weaker Whisper models.
          rm -f ggml-base-*.bin
          rm -f ggml-small-*.bin

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

          echo "Downloaded model:"
          ls -lh ggml-large-v3-turbo-q5_0.bin

          # Sanity check: real model should be hundreds of MB, not an LFS pointer/error page.
          SIZE=$(stat -c%s ggml-large-v3-turbo-q5_0.bin)
          if [ "$SIZE" -lt 500000000 ]; then
            echo "Model download is unexpectedly small: $SIZE bytes"
            exit 1
          fi

      - name: Build Fold7 arm64 APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PtargetAbi=arm64-v8a \
            assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          APK=$(find source/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" out/VoiceSkip-Fold7-Large-v3-Turbo-Adreno830.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSkip-Fold7-APK
          path: out/VoiceSkip-Fold7-Large-v3-Turbo-Adreno830.apk
          retention-days: 30
